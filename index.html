      /* Boot splash: painted before any JS, replaced when React mounts. */

      @keyframes boot { 50% { transform: scale(0.92); box-shadow: 0 0 30px rgba(90, 169, 255, 0.2); } }
      @media (prefers-reduced-motion: reduce) { .boot__orb { animation: none; } }
    </style>
